<div class="login-wrapper d-flex align-items-center justify-content-center">
    
    <div class="synthwave-grid"></div>

    <div class="card login-card shadow-lg p-5">
        
        <h3 class="text-center mb-1 neon-title">SketchMind</h3>
        <p class="text-center neon-subtitle mb-4">SYSTEM_ACCESS // TIENDA_ARTE</p>
        
        <form>
            <div class="mb-4 input-group-neon">
                <label class="form-label">IDENTIFICACIÓN (CORREO)</label>
                <input type="email" class="form-control synth-input" placeholder="correo@ejemplo.com" name="correo" >
            </div>
            
            <div class="mb-5 input-group-neon">
                <label class="form-label">CLAVE DE ACCESO</label>
                <input type="password" class="form-control synth-input" placeholder="********" name="password" >
            </div>
            
            <input type="button" class="btn btn-synth w-100" value="INICIALIZAR SECUENCIA" (click)="consulta('')">
        </form>
    </div>
</div>
