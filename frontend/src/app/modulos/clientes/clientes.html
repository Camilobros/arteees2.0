<!-- ================= MIGA DE PAN ================= -->
<nav>
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Inicio</a></li>
        <li class="breadcrumb-item active">Clientes</li>
    </ol>
</nav>

<!-- ================= TÍTULO ================= -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">Gestión de Clientes</h2>
    <button class="btn btn-primary">
        <i class="bi bi-person-plus"></i> Nuevo Cliente
    </button>
</div>

<!-- ================= BUSCADOR ================= -->
<div class="card shadow-sm p-3 mb-4">
    <div class="row">
        <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Buscar cliente...">
        </div>
        <div class="col-md-3">
            <select class="form-select">
                <option>Filtrar por estado</option>
                <option>Activo</option>
                <option>Inactivo</option>
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-secondary w-100">Buscar</button>
        </div>
    </div>
</div>

<!-- ================= TABLA DE CLIENTES ================= -->
<div class="card shadow-sm p-3">
    <h5 class="mb-3">Lista de Clientes</h5>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead class="table-primary">
                <tr>
                    <th></th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Dirección</th>
                    <th>EstadooOsS</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                @for (item of clientes; track $index) {
                    <tr>
                        <td>{{item.id_cliente}}</td>
                        <td>{{item.nombre}}</td>
                        <td>{{item.correo}}</td>
                        <td>{{item.direccion}}</td>
                        <td><span class="badge bg-success">Activo</span></td>
                        
                        <td>
                            <span class="fas fa-edit" style="color:brown; cursor: pointer; font-size: 1.2rem; margin-right: 10px;" title="editar"></span>
                            <span class="fas fa-minus-square" style="color: red; cursor: pointer; font-size: 1.2rem;" title="eliminar"></span>
                        </td>
                    </tr>
                } @empty {
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="fas fa-spinner fa-spin"></i> Cargando datos desde PHP...
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
