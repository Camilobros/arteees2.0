
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SketchMind - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #3f51b5, #6a1b9a);
            height: 100vh;
        }
        .login-card {
            border-radius: 20px;
        }
        .btn-sketch {
            background-color: #6a1b9a;
            color: white;
        }
        .btn-sketch:hover {
            background-color: #512da8;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <!-- LOGIN CARD -->
    <div class="card login-card shadow-lg p-4" style="width: 400px;">
        <h3 class="text-center mb-3 text-primary">SketchMind</h3>
        <p class="text-center text-muted">Software de Gestión - Tienda de Arte</p>
        
        <form>
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" class="form-control" placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" placeholder="********">
            </div>
            <button class="btn btn-sketch w-100">Ingresar</button>
        </form>
    </div>

</body>
</html>
